<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payload Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f6f8;--surface:#fff;--surface2:#f0f2f5;--border:#e2e5ea;
  --border-focus:#3b6bdb;--text:#1a1d23;--text-2:#4b5260;--text-3:#8b93a4;
  --accent:#3b6bdb;--accent-bg:#edf2ff;
  --success:#1a7f5a;--success-bg:#e8f7f1;
  --danger:#c0392b;--danger-bg:#fdf0ee;
  --warning:#b45309;--warning-bg:#fffbeb;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --radius:8px;--radius-sm:5px;
  --mono:'IBM Plex Mono',monospace;--sans:'DM Sans',sans-serif;
  --ln-w:46px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;display:flex;flex-direction:column;}

.topbar{background:var(--surface);border-bottom:1px solid var(--border);height:48px;display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
.brand-icon{width:26px;height:26px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;}
.topbar-sep{width:1px;height:22px;background:var(--border);}
.topbar-sub{font-size:12px;color:var(--text-3);}
.topbar-right{margin-left:auto;display:flex;gap:6px;}

.btn{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .12s,border-color .12s,color .12s;white-space:nowrap;line-height:1;}
.btn:hover{background:var(--surface2);border-color:#c8cdd6;color:var(--text);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#2f5cc7;border-color:#2f5cc7;color:#fff;}
.btn-success{background:var(--success-bg);border-color:#b3dece;color:var(--success);}
.btn-success:hover{background:#d1f0e5;color:var(--success);}
.btn-danger{background:transparent;border-color:var(--border);color:var(--text-3);}
.btn-danger:hover{background:var(--danger-bg);border-color:#e8b4ae;color:var(--danger);}
.btn-sm{font-size:11.5px;padding:4px 9px;}
.btn-icon{padding:5px 8px;font-size:13px;}

.workspace{flex:1;display:flex;overflow:hidden;padding:10px;gap:10px;min-height:0;}

.editor-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;overflow:hidden;flex:1;min-width:0;min-height:0;}
.editor-panel:focus-within{border-color:#b8c9f0;box-shadow:0 2px 8px rgba(0,0,0,.08),0 0 0 3px rgba(59,107,219,.06);}

.panel-header{padding:5px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;}
.panel-title{font-size:12.5px;font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-radius:3px;padding:2px 5px;transition:background .1s;}
.panel-title:hover{background:var(--surface2);}
.panel-title-input{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--text);flex:1;border:1px solid var(--border-focus);border-radius:3px;padding:2px 6px;outline:none;background:var(--surface);display:none;min-width:0;}
.panel-title-input.active{display:block;}
.panel-title.hidden{display:none;}
.rename-hint{font-size:10px;color:var(--text-3);flex-shrink:0;white-space:nowrap;}
.panel-status{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:3px;flex-shrink:0;}
.st-valid{color:var(--success);background:var(--success-bg);}
.st-invalid{color:var(--danger);background:var(--danger-bg);white-space:normal;word-break:break-word;flex:1 1 100%;}
.st-empty{color:var(--text-3);}
.issues-btn{font-size:10.5px;padding:2px 7px;border-radius:3px;border:1px solid #f1b9b2;background:#fff6f5;color:var(--danger);cursor:pointer;display:none;}
.issues-btn.show{display:inline-block;}
.issues-panel{display:none;padding:6px 10px;border-bottom:1px solid var(--border);background:#fff7f6;max-height:120px;overflow:auto;}
.issues-panel.open{display:block;}
.issues-list{margin:0;padding-left:16px;font-family:var(--mono);font-size:11px;color:var(--danger);}

.search-row{padding:5px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:4px;background:var(--surface2);flex-shrink:0;}
.search-wrap{flex:1;position:relative;}
.search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px 4px 26px;font-family:var(--mono);font-size:11.5px;color:var(--text);outline:none;transition:border-color .12s;}
.search-input:focus{border-color:var(--border-focus);}
.search-input::placeholder{color:var(--text-3);}
.search-hits{font-family:var(--mono);font-size:10.5px;color:var(--text-3);min-width:58px;text-align:right;white-space:nowrap;}
.search-opt-group{display:flex;align-items:center;gap:3px;}
.search-opt{font-family:var(--mono);font-size:10.5px;line-height:1;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text-3);cursor:pointer;min-width:26px;text-align:center;}
.search-opt:hover{background:var(--surface2);color:var(--text-2);}
.search-opt.on{background:var(--accent-bg);border-color:#a8bef0;color:var(--accent);}

.fields-row{padding:5px 8px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:4px;flex-wrap:wrap;background:var(--surface);flex-shrink:0;}
.field-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:11px;color:var(--text-2);transition:all .1s;user-select:none;}
.field-chip:has(input:checked){background:var(--accent-bg);border-color:#a8bef0;color:var(--accent);}
.field-chip input{display:none;}
.chip-check{width:11px;height:11px;border-radius:2px;border:1.5px solid #c0c8d8;background:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;color:transparent;transition:all .1s;flex-shrink:0;}
.field-chip:has(input:checked) .chip-check{background:var(--accent);border-color:var(--accent);color:#fff;}
.chip-del{background:none;border:none;cursor:pointer;color:#a0a8b8;font-size:9px;line-height:1;padding:0 0 0 2px;transition:color .1s;}
.chip-del:hover{color:var(--danger);}
.add-field-row{display:none;align-items:center;gap:5px;width:100%;margin-top:4px;}
.add-field-row.open{display:flex;}
.add-field-input{flex:1;background:var(--surface);border:1px solid var(--border-focus);border-radius:var(--radius-sm);padding:4px 8px;font-family:var(--mono);font-size:11px;color:var(--text);outline:none;}

/* ── Code region ── */
.code-wrap{flex:1;display:flex;overflow:hidden;min-height:0;background:#fdfdfe;position:relative;}
.code-wrap.invalid-bg{background:#fff8f7;}

/* Gutter */
.ln-gutter{
  width:var(--ln-w);
  flex-shrink:0;
  background:#f8f9fb;
  border-right:1px solid var(--border);
  overflow:hidden;
  position:relative;
}
.ln-track{
  position:absolute;
  top:0;left:0;right:0;
  padding-top:12px;
  pointer-events:none;
  will-change:transform;
}
.ln-item{
  font-family:var(--mono);
  font-size:12px;
  color:#b0b8c8;
  text-align:right;
  padding-right:7px;
  overflow:hidden;
  white-space:nowrap;
}

/* Editor stack */
.ed-stack{
  flex:1;
  position:relative;
  min-width:0;
  overflow:hidden;
}

/* Highlight overlay */
.hl-wrap{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:1;
}
.hl-body{
  position:absolute;
  top:0;left:0;right:0;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  line-height:1.65;
  padding:12px 12px 12px 10px;
  white-space:pre-wrap;
  word-break:break-all;
  color:transparent;
  will-change:transform;
}
mark.h{
  background:rgba(255,210,0,0.5);
  border-radius:2px;
  color:transparent;
}
mark.h.c{
  background:rgba(255,210,0,0.5);
  border-radius:2px;
  color:transparent;
}

/* Textarea */
.ta{
  position:absolute;
  inset:0;
  resize:none;
  border:none;
  outline:none;
  background:transparent;
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  line-height:1.65;
  color:var(--text);
  padding:12px 12px 12px 10px;
  tab-size:2;
  white-space:pre-wrap;
  word-break:break-all;
  overflow-y:scroll;
  overflow-x:hidden;
  z-index:2;
  caret-color:var(--text);
}
.ta::selection{background:rgba(59,107,219,0.22);}
.ta::placeholder{color:var(--text-3);}
.ta.nowrap{white-space:pre;word-break:normal;overflow-x:auto;}
.hl-body.nowrap{white-space:pre;word-break:normal;}

.warn-bar{display:none;padding:4px 12px;background:var(--warning-bg);border-top:1px solid #fde68a;font-size:11px;color:var(--warning);flex-shrink:0;}
.warn-bar.on{display:block;}

.action-bar{padding:6px 8px;border-top:1px solid var(--border);display:flex;align-items:center;gap:5px;background:var(--surface2);flex-shrink:0;flex-wrap:wrap;}
.action-sep{width:1px;height:16px;background:var(--border);margin:0 2px;}

.overlay{display:none;position:fixed;inset:0;background:rgba(15,18,26,.35);backdrop-filter:blur(2px);z-index:100;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:22px 24px;width:340px;animation:mIn .15s ease;}
@keyframes mIn{from{opacity:0;transform:translateY(-6px) scale(.98);}to{opacity:1;transform:none;}}
.modal-title{font-size:14px;font-weight:600;margin-bottom:14px;}
.modal-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--sans);font-size:13px;color:var(--text);outline:none;margin-bottom:16px;transition:border-color .12s;}
.modal-input:focus{border-color:var(--border-focus);}
.modal-footer{display:flex;gap:7px;justify-content:flex-end;}

*::-webkit-scrollbar{width:5px;height:5px;}
*::-webkit-scrollbar-track{background:transparent;}
*::-webkit-scrollbar-thumb{background:#d4d8e0;border-radius:3px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="brand-icon">P</div>Payload Editor</div>
  <div class="topbar-sep"></div>
  <span class="topbar-sub">JSON · GUID Generator</span>
  <div class="topbar-right">
    <button class="btn" id="wrapToggle" onclick="toggleWrap()">Wrap: On</button>
    <button class="btn" onclick="formatAll()">{ } Format All</button>
    <button class="btn btn-primary" onclick="generateAll()">▶ Generate All</button>
  </div>
</div>

<div class="workspace">
  <div class="editor-panel" id="panel-0"></div>
  <div class="editor-panel" id="panel-1"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Rename</div>
    <input class="modal-input" id="modalInput" placeholder="…"/>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmModal()">OK</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const DEFAULT_FIELDS = ['sessionId','correlationId','tacticId','eventId','sourceId','sessionid','emailDeploymentId'];
const SK = 'pe_v8';

const TA_FONT_SIZE = 12;
const TA_LINE_H    = 1.65;
const TA_PAD_TOP   = 12;
const TA_PAD_L     = 10;
const TA_PAD_R     = 12;

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let editors = [
  {fields:[...DEFAULT_FIELDS],customFields:[],content:'',title:'Editor 1'},
  {fields:[...DEFAULT_FIELDS],customFields:[],content:'',title:'Editor 2'}
];
let search = [
  {q:'',matches:[],cur:-1,opts:{matchCase:false,wholeWord:false,regex:false}},
  {q:'',matches:[],cur:-1,opts:{matchCase:false,wholeWord:false,regex:false}}
];
let issueState = [
  {open:false,items:[]},
  {open:false,items:[]}
];
let isWrap = true;
let modalCb = null;
let _lhPx   = 0;

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function getLhPx() {
  if (_lhPx) return _lhPx;
  const ta = document.querySelector('.ta');
  _lhPx = ta ? parseFloat(getComputedStyle(ta).lineHeight) : TA_FONT_SIZE * TA_LINE_H;
  return _lhPx;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _md = null;
function getMeasurer(contentWidth) {
  if (!_md) {
    _md = document.createElement('div');
    Object.assign(_md.style,{
      position:'absolute',visibility:'hidden',top:'-9999px',left:'-9999px',
      fontFamily:'"IBM Plex Mono",monospace',fontSize:'12px',
      lineHeight:'1.65','white-space':'pre-wrap','word-break':'break-all',
      padding:'0',border:'none',margin:'0'
    });
    document.body.appendChild(_md);
  }
  _md.style.width = contentWidth + 'px';
  return _md;
}

function visualRowCounts(text, taContentWidth) {
  const lh = getLhPx();
  const m  = getMeasurer(taContentWidth);
  return text.split('\n').map(line => {
    if (!line) return 1;
    m.textContent = line;
    return Math.max(1, Math.round(m.getBoundingClientRect().height / lh));
  });
}

/* ═══════════════════════════════════════════
   PERSIST
═══════════════════════════════════════════ */
function save() {
  [0,1].forEach(i => {
    const ta = document.getElementById('ta-'+i);
    if (ta) editors[i].content = ta.value;
  });
  try {
    localStorage.setItem(SK, JSON.stringify({
      editors: editors.map(e => ({
        fields:e.fields, customFields:e.customFields,
        content:e.content, title:e.title
      })),
      isWrap
    }));
  } catch(_) {}
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SK)||'{}');
    if (s.editors?.length === 2) {
      editors = s.editors.map((e,i) => ({
        fields:      e.fields      || [...DEFAULT_FIELDS],
        customFields:e.customFields|| [],
        content:     e.content     || '',
        title:       e.title       || 'Editor '+(i+1)
      }));
    }
    if (typeof s.isWrap === 'boolean') isWrap = s.isWrap;
  } catch(_) {}
}

/* ═══════════════════════════════════════════
   MODAL
═══════════════════════════════════════════ */
function openModal(title, val, cb) {
  modalCb = cb;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalInput').value = val || '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => { const i = document.getElementById('modalInput'); i.focus(); i.select(); }, 60);
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); modalCb = null; }
function confirmModal() { const v = document.getElementById('modalInput').value; closeModal(); if (modalCb) modalCb(v); }
document.getElementById('modalInput').addEventListener('keydown', e => {
  if (e.key==='Enter')  confirmModal();
  if (e.key==='Escape') closeModal();
});
document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) closeModal();
});

/* ═══════════════════════════════════════════
   RENAME
═══════════════════════════════════════════ */
function startRename(i) {
  const span = document.getElementById('ptitle-'+i);
  const inp  = document.getElementById('ptitle-inp-'+i);
  if (!span || !inp) return;
  inp.value = editors[i].title;
  span.classList.add('hidden');
  inp.classList.add('active');
  inp.focus(); inp.select();
}
function endRename(i) {
  const span = document.getElementById('ptitle-'+i);
  const inp  = document.getElementById('ptitle-inp-'+i);
  if (!span || !inp) return;
  const v = inp.value.trim();
  if (v) { editors[i].title = v; span.textContent = v; }
  span.classList.remove('hidden');
  inp.classList.remove('active');
  save();
}

/* ═══════════════════════════════════════════
   FIELDS
═══════════════════════════════════════════ */
function toggleAddField(i) {
  const r = document.getElementById('add-row-'+i);
  if (!r) return;
  if (r.classList.toggle('open')) setTimeout(() => document.getElementById('add-inp-'+i)?.focus(), 40);
}
function addField(i) {
  const inp = document.getElementById('add-inp-'+i);
  const val = inp?.value?.trim();
  if (!val) return;
  const e = editors[i];
  if (e.fields.includes(val)) { alert('Already exists.'); return; }
  e.fields.push(val); e.customFields.push(val);
  const saved = document.getElementById('ta-'+i)?.value || '';
  save(); renderPanel(i);
  setTimeout(() => { const ta = document.getElementById('ta-'+i); if (ta) { ta.value = saved; onInput(i); }}, 10);
}
function removeField(i, field) {
  const saved = document.getElementById('ta-'+i)?.value || '';
  editors[i].fields = editors[i].fields.filter(f => f!==field);
  editors[i].customFields = editors[i].customFields.filter(f => f!==field);
  save(); renderPanel(i);
  setTimeout(() => { const ta = document.getElementById('ta-'+i); if (ta) { ta.value = saved; onInput(i); }}, 10);
}

/* ═══════════════════════════════════════════
   LINE NUMBERS
═══════════════════════════════════════════ */
function rebuildLn(i) {
  const ta    = document.getElementById('ta-'+i);
  const track = document.getElementById('ln-track-'+i);
  if (!ta || !track) return;

  const taRect = ta.getBoundingClientRect();
  const contentW = taRect.width - TA_PAD_L - TA_PAD_R;
  if (contentW <= 0) return;

  const lh     = getLhPx();
  const text   = ta.value;
  const lines  = text ? text.split('\n') : [''];
  const counts = isWrap ? visualRowCounts(text || '', contentW) : lines.map(() => 1);

  let html = '';
  for (let n = 0; n < lines.length; n++) {
    const rows = counts[n] || 1;
    const h    = rows * lh;
    html += `<div class="ln-item" style="height:${h}px;line-height:${h}px">${n+1}</div>`;
  }
  track.innerHTML = html;
  syncScroll(i);
}

function syncScroll(i) {
  const ta    = document.getElementById('ta-'+i);
  const track = document.getElementById('ln-track-'+i);
  const hlb   = document.getElementById('hl-body-'+i);
  if (!ta) return;
  const st = ta.scrollTop;
  if (track) track.style.transform = `translateY(${-st}px)`;
  if (hlb)   hlb.style.transform   = `translateY(${-st}px)`;
}

/* ═══════════════════════════════════════════
  SEARCH & HIGHLIGHT
═══════════════════════════════════════════ */
function onSearch(i, val) {
  const s = search[i];
  s.q = val; s.cur = -1; s.matches = [];
  const hEl = document.getElementById('hits-'+i);
  if (!val.trim()) { if (hEl) hEl.textContent=''; renderHl(i); return; }
  const ta = document.getElementById('ta-'+i);
  if (!ta) return;
  const text = ta.value;
  const opts = s.opts || {matchCase:false,wholeWord:false,regex:false};
  if (!opts.regex) {
    const hay = opts.matchCase ? text : text.toLowerCase();
    const needle = opts.matchCase ? val : val.toLowerCase();
    let pos = 0;
    while (true) {
      const ix = hay.indexOf(needle, pos);
      if (ix === -1) break;
      if (!opts.wholeWord || isWholeWordAt(text, ix, val.length)) s.matches.push(ix);
      pos = ix + 1;
    }
  } else {
    const flags = opts.matchCase ? 'g' : 'gi';
    let re;
    try {
      re = new RegExp(val, flags);
    } catch (_) {
      if (hEl) hEl.textContent = 'invalid regex';
      renderHl(i);
      return;
    }
    let m;
    while ((m = re.exec(text)) !== null) {
      if (!m[0]) { re.lastIndex += 1; continue; }
      s.matches.push(m.index);
    }
  }
  if (hEl) hEl.textContent = s.matches.length
    ? s.matches.length+' match'+(s.matches.length>1?'es':'')
    : 'none';
  renderHl(i);
}

function isWordChar(ch) {
  return !!ch && /[A-Za-z0-9_]/.test(ch);
}

function isWholeWordAt(text, start, len) {
  const prev = start > 0 ? text[start - 1] : '';
  const next = start + len < text.length ? text[start + len] : '';
  return !isWordChar(prev) && !isWordChar(next);
}

function toggleSearchOpt(i, key) {
  const s = search[i];
  if (!s?.opts || !(key in s.opts)) return;
  s.opts[key] = !s.opts[key];
  const el = document.getElementById(`sopt-${key}-${i}`);
  if (el) el.classList.toggle('on', s.opts[key]);
  const val = document.getElementById('s-'+i)?.value || '';
  onSearch(i, val);
}

function onSearchKey(i, e) {
  if (e.key === 'Enter') { e.preventDefault(); navSearch(i, e.shiftKey ? -1 : 1); }
}

function navSearch(i, dir) {
  const s = search[i];
  if (!s.matches.length) return;
  s.cur = (s.cur + dir + s.matches.length) % s.matches.length;
  renderHl(i);
  scrollToMatch(i, s.matches[s.cur]);
  const hEl = document.getElementById('hits-'+i);
  if (hEl) hEl.textContent = (s.cur+1)+' / '+s.matches.length;
}

function scrollToMatch(i, charIdx) {
  const ta    = document.getElementById('ta-'+i);
  const track = document.getElementById('ln-track-'+i);
  if (!ta) return;

  const beforeMatch = ta.value.substring(0, charIdx);
  const logLineIdx  = (beforeMatch.match(/\n/g) || []).length;

  const lh    = getLhPx();
  const divs  = track ? track.querySelectorAll('.ln-item') : [];
  let offsetY = TA_PAD_TOP;
  for (let n = 0; n < logLineIdx && n < divs.length; n++) {
    offsetY += parseFloat(divs[n].style.height) || lh;
  }
  const halfView = ta.clientHeight / 2;
  ta.scrollTop = Math.max(0, offsetY - halfView);
  syncScroll(i);

  ta.focus();
  ta.setSelectionRange(charIdx, charIdx + s_q(i));
}
function s_q(i){ return search[i].q.length; }

function renderHl(i) {
  const hlb = document.getElementById('hl-body-'+i);
  if (!hlb) return;
  const ta  = document.getElementById('ta-'+i);
  if (!ta)  return;
  const s   = search[i];
  const text = ta.value;

  if (!s.q || !s.matches.length) {
    hlb.innerHTML = escHtml(text);
    return;
  }

  const qLen = s.q.length;
  let html = '', pos = 0;
  for (let mi = 0; mi < s.matches.length; mi++) {
    const ms = s.matches[mi];
    html += escHtml(text.slice(pos, ms));
    html += `<mark class="h${mi===s.cur?' c':''}">${escHtml(text.slice(ms, ms+qLen))}</mark>`;
    pos = ms + qLen;
  }
  html += escHtml(text.slice(pos));
  hlb.innerHTML = html;
}

function detectLikelyIssues(text) {
  const lines = text.split('\n');
  const issues = [];
  const sig = [];
  const lineStarts = [];
  let acc = 0;
  for (let i = 0; i < lines.length; i++) {
    lineStarts.push(acc);
    acc += lines[i].length + 1;
  }
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (t) sig.push({idx:i, t});
  }

  for (let s = 0; s < sig.length - 1; s++) {
    const cur = sig[s];
    const nxt = sig[s + 1];
    const c = cur.t;
    const n = nxt.t;
    const nextIsClose = n.startsWith('}') || n.startsWith(']');
    if (nextIsClose) continue;

    const isProp = /^"[^"\\]*(?:\\.[^"\\]*)*"\s*:/.test(c);
    const endsWithComma = /,\s*$/.test(c);
    const endsWithOpen = /[\[{]\s*$/.test(c);
    const raw = lines[cur.idx] || '';
    const lastNonSpace = raw.search(/\s*$/);
    const pos = lineStarts[cur.idx] + lastNonSpace;
    const col = lastNonSpace + 1;

    if (isProp && !endsWithComma && !endsWithOpen) {
      issues.push({line: cur.idx + 1, col, pos, msg: 'Likely missing comma at end of property'});
      continue;
    }

    const isArrayValue = /^(".*"|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null|\{|\[)/.test(c);
    if (!isProp && isArrayValue && !endsWithComma && !endsWithOpen) {
      issues.push({line: cur.idx + 1, col, pos, msg: 'Likely missing comma between array items'});
    }
  }
  return issues;
}

function parseJsonErrorDetails(message, text) {
  const msg = message || '';
  const lineColParen = /\(line\s+(\d+)\s+column\s+(\d+)\)/i.exec(msg);
  const lineColLoose = /line\s+(\d+)\s+column\s+(\d+)/i.exec(msg);
  const lineOnly = /line\s+(\d+)/i.exec(msg);
  const colOnly = /column\s+(\d+)/i.exec(msg);
  const posMatch = /position\s+(\d+)/i.exec(msg);

  let line = null;
  let col = null;
  let pos = posMatch ? Number(posMatch[1]) : null;

  if (lineColParen) {
    line = Number(lineColParen[1]);
    col = Number(lineColParen[2]);
  } else if (lineColLoose) {
    line = Number(lineColLoose[1]);
    col = Number(lineColLoose[2]);
  } else {
    if (lineOnly) line = Number(lineOnly[1]);
    if (colOnly) col = Number(colOnly[1]);
  }

  if ((line == null || col == null) && pos != null && Number.isFinite(pos)) {
    const upto = text.slice(0, Math.max(0, pos));
    const parts = upto.split('\n');
    line = parts.length;
    col = (parts[parts.length - 1] || '').length + 1;
  }

  if ((pos == null || !Number.isFinite(pos)) && line != null && col != null) {
    const rows = text.split('\n');
    let offset = 0;
    for (let i = 0; i < Math.max(0, line - 1) && i < rows.length; i++) offset += rows[i].length + 1;
    pos = offset + Math.max(0, col - 1);
  }

  return {
    line: Number.isFinite(line) ? line : null,
    col: Number.isFinite(col) ? col : null,
    pos: Number.isFinite(pos) ? pos : null,
    msg: msg || 'Invalid JSON'
  };
}

function renderIssues(i) {
  const btn = document.getElementById('issues-btn-'+i);
  const panel = document.getElementById('issues-panel-'+i);
  const list = document.getElementById('issues-list-'+i);
  if (!btn || !panel || !list) return;

  const items = issueState[i].items || [];
  if (!items.length) {
    btn.classList.remove('show');
    panel.classList.remove('open');
    list.innerHTML = '';
    return;
  }

  btn.classList.add('show');
  btn.textContent = `Issues (${items.length})`;
  list.innerHTML = items.map(it => {
    const parts = [];
    if (it.line != null) parts.push(`Line ${it.line}`);
    if (it.col != null) parts.push(`Col ${it.col}`);
    if (it.pos != null) parts.push(`Pos ${it.pos}`);
    const loc = parts.length ? parts.join(', ') : 'Location unknown';
    return `<li>${loc}: ${escHtml(it.msg)}</li>`;
  }).join('');
  panel.classList.toggle('open', issueState[i].open);
}

function toggleIssues(i) {
  issueState[i].open = !issueState[i].open;
  renderIssues(i);
}

/* ═══════════════════════════════════════════
   JSON OPERATIONS
═══════════════════════════════════════════ */
function validateJson(i) {
  const ta   = document.getElementById('ta-'+i);
  const stEl = document.getElementById('st-'+i);
  const cw   = document.getElementById('cw-'+i);
  if (!ta || !stEl) return;
  const v = ta.value.trim();
  if (!v) {
    cw?.classList.remove('invalid-bg');
    issueState[i].items = [];
    issueState[i].open = false;
    renderIssues(i);
    stEl.textContent=''; stEl.className='panel-status st-empty'; return;
  }
  try {
    JSON.parse(v);
    cw?.classList.remove('invalid-bg');
    issueState[i].items = [];
    issueState[i].open = false;
    renderIssues(i);
    stEl.textContent='✓ Valid JSON'; stEl.className='panel-status st-valid';
  } catch(err) {
    cw?.classList.add('invalid-bg');
    const parserIssue = parseJsonErrorDetails(err.message, ta.value);
    const likely = detectLikelyIssues(ta.value);
    let items = [...likely];

    // Parser often points to the next line where parsing broke.
    // If we already detected a missing-comma root cause on the previous line,
    // prefer that single source line and hide the redundant parser line.
    const prevLineComma = (parserIssue.line != null)
      ? likely.find(x =>
          x.line === parserIssue.line - 1 &&
          /missing comma/i.test(x.msg)
        )
      : null;

    if (!prevLineComma) {
      items = [parserIssue, ...items];
    }

    issueState[i].items = items;
    renderIssues(i);
    stEl.textContent='✗ Invalid JSON'; stEl.className='panel-status st-invalid';
  }
}

function guid() { return crypto.randomUUID(); }
function replaceGuids(obj, fields) {
  if (Array.isArray(obj)) { obj.forEach(x => replaceGuids(x,fields)); return; }
  if (obj && typeof obj==='object')
    Object.keys(obj).forEach(k => { if (fields.includes(k)) obj[k]=guid(); replaceGuids(obj[k],fields); });
}

function generate(i) {
  const ta   = document.getElementById('ta-'+i);
  const warn = document.getElementById('warn-'+i);
  if (!ta) return; warn.classList.remove('on');
  if (!ta.value.trim()) { alert('Paste JSON first.'); return; }
  try {
    const json    = JSON.parse(ta.value);
    const checked = [...document.querySelectorAll(`input[data-ei="${i}"]:checked`)].map(x=>x.value);
    const found   = [];
    function scan(o){
      if(Array.isArray(o)){o.forEach(scan);return;}
      if(o&&typeof o==='object') Object.keys(o).forEach(k=>{if(checked.includes(k))found.push(k);scan(o[k]);});
    }
    scan(json);
    const missing = checked.filter(x=>!found.includes(x));
    if(missing.length){ warn.textContent='⚠ Not found: '+missing.join(', '); warn.classList.add('on'); }
    replaceGuids(json, checked);
    ta.value = JSON.stringify(json, null, 2);
    onInput(i); save();
  } catch(e){ validateJson(i); alert('Invalid JSON'); }
}

function copyPanel(i) {
  const ta = document.getElementById('ta-'+i);
  if (!ta?.value.trim()) { alert('Nothing to copy.'); return; }
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.getElementById('copybtn-'+i);
    if (btn) { btn.textContent='✓ Copied'; setTimeout(()=>btn.textContent='Copy',1500); }
  });
}

function clearPanel(i) {
  const ta = document.getElementById('ta-'+i);
  if (ta) ta.value = '';
  document.getElementById('warn-'+i)?.classList.remove('on');
  const si = document.getElementById('s-'+i);
  if (si) si.value='';
  const prevOpts = search[i]?.opts || {matchCase:false,wholeWord:false,regex:false};
  search[i] = {q:'',matches:[],cur:-1,opts:prevOpts};
  document.getElementById('hits-'+i) && (document.getElementById('hits-'+i).textContent='');
  editors[i].content='';
  onInput(i); save();
}

function applyWrap(i) {
  const ta = document.getElementById('ta-'+i);
  const hlb = document.getElementById('hl-body-'+i);
  if (ta) ta.classList.toggle('nowrap', !isWrap);
  if (hlb) hlb.classList.toggle('nowrap', !isWrap);
  rebuildLn(i);
  renderHl(i);
  syncScroll(i);
}

function toggleWrap() {
  isWrap = !isWrap;
  applyWrap(0);
  applyWrap(1);
  const b = document.getElementById('wrapToggle');
  if (b) b.textContent = isWrap ? 'Wrap: On' : 'Wrap: Off';
  save();
}

function formatPanel(i) {
  const ta = document.getElementById('ta-'+i);
  if (!ta) return;
  try { ta.value=JSON.stringify(JSON.parse(ta.value),null,2); onInput(i); }
  catch{ alert('Invalid JSON'); }
}

function generateAll(){ [0,1].forEach(generate); }
function formatAll()  { [0,1].forEach(formatPanel); }

/* ═══════════════════════════════════════════
   onInput
═══════════════════════════════════════════ */
function onInput(i) {
  validateJson(i);
  rebuildLn(i);
  const q = document.getElementById('s-'+i)?.value||'';
  if (q) onSearch(i, q); else renderHl(i);
}

/* ═══════════════════════════════════════════
   RENDER PANEL
═══════════════════════════════════════════ */
function renderPanel(idx) {
  const panel = document.getElementById('panel-'+idx);
  if (!panel) return;
  const e = editors[idx];

  const chips = e.fields.map(field => {
    const custom = e.customFields.includes(field);
    return `<label class="field-chip">
      <input type="checkbox" checked data-ei="${idx}" value="${escAttr(field)}"/>
      <span class="chip-check">✓</span>
      <span>${escHtml(field)}</span>
      ${custom?`<button class="chip-del" onclick="event.preventDefault();removeField(${idx},'${escAttr(field)}')" title="Remove">✕</button>`:''}
    </label>`;
  }).join('');

  panel.innerHTML = `
    <div class="panel-header">
      <span class="panel-title" id="ptitle-${idx}" title="Click to rename" onclick="startRename(${idx})">${escHtml(e.title)}</span>
      <input class="panel-title-input" id="ptitle-inp-${idx}"
        onblur="endRename(${idx})"
        onkeydown="if(event.key==='Enter'||event.key==='Escape')endRename(${idx})"/>
      <span class="rename-hint">✎ click title to rename</span>
      <button class="issues-btn" id="issues-btn-${idx}" onclick="toggleIssues(${idx})">Issues (0)</button>
      <span class="panel-status st-empty" id="st-${idx}"></span>
    </div>
    <div class="issues-panel" id="issues-panel-${idx}">
      <ul class="issues-list" id="issues-list-${idx}"></ul>
    </div>
    <div class="search-row">
      <div class="search-wrap">
        <span class="search-ico">⌕</span>
        <input class="search-input" id="s-${idx}"
          placeholder="Search…  Enter ↓  Shift+Enter ↑"
          autocomplete="off" spellcheck="false"
          oninput="onSearch(${idx},this.value)"
          onkeydown="onSearchKey(${idx},event)"/>
      </div>
      <div class="search-opt-group" title="Search options">
        <button class="search-opt${search[idx].opts.matchCase?' on':''}" id="sopt-matchCase-${idx}" onclick="toggleSearchOpt(${idx},'matchCase')" title="Match Case">Aa</button>
        <button class="search-opt${search[idx].opts.wholeWord?' on':''}" id="sopt-wholeWord-${idx}" onclick="toggleSearchOpt(${idx},'wholeWord')" title="Whole Word">ab</button>
        <button class="search-opt${search[idx].opts.regex?' on':''}" id="sopt-regex-${idx}" onclick="toggleSearchOpt(${idx},'regex')" title="Use Regex">.*</button>
      </div>
      <button class="btn btn-icon btn-sm" onclick="navSearch(${idx},-1)" title="Previous">↑</button>
      <button class="btn btn-icon btn-sm" onclick="navSearch(${idx},1)"  title="Next">↓</button>
      <span class="search-hits" id="hits-${idx}"></span>
    </div>
    <div class="fields-row">
      ${chips}
      <button class="btn btn-sm" style="font-size:11px;" onclick="toggleAddField(${idx})">+ Field</button>
      <div class="add-field-row" id="add-row-${idx}">
        <input class="add-field-input" id="add-inp-${idx}" placeholder="Field name"
          onkeydown="if(event.key==='Enter')addField(${idx});if(event.key==='Escape')toggleAddField(${idx})"/>
        <button class="btn btn-sm btn-primary" onclick="addField(${idx})">Add</button>
        <button class="btn btn-sm" onclick="toggleAddField(${idx})">✕</button>
      </div>
    </div>
    <div class="code-wrap" id="cw-${idx}">
      <div class="ln-gutter">
        <div class="ln-track" id="ln-track-${idx}">
          <div class="ln-item" style="height:19.8px;line-height:19.8px">1</div>
        </div>
      </div>
      <div class="ed-stack">
        <div class="hl-wrap">
          <div class="hl-body" id="hl-body-${idx}"></div>
        </div>
        <textarea class="ta" id="ta-${idx}"
          placeholder="Paste JSON payload here…"
          spellcheck="false"
          oninput="onInput(${idx})"
          onscroll="syncScroll(${idx})"
          onblur="save()"
        >${escHtml(e.content)}</textarea>
      </div>
    </div>
    <div class="warn-bar" id="warn-${idx}"></div>
    <div class="action-bar">
      <button class="btn btn-success btn-sm" onclick="generate(${idx})">▶ Generate</button>
      <button class="btn btn-sm" id="copybtn-${idx}" onclick="copyPanel(${idx})">Copy</button>
      <div class="action-sep"></div>
      <button class="btn btn-sm" onclick="formatPanel(${idx})">{ } Format</button>
      <div class="action-sep"></div>
      <button class="btn btn-danger btn-sm" onclick="clearPanel(${idx})">Clear</button>
    </div>`;

  requestAnimationFrame(() => {
    applyWrap(idx);
    validateJson(idx);
    rebuildLn(idx);
    renderHl(idx);
  });
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
load();
// Always start with wrap enabled so long lines and errors are readable by default.
isWrap = true;
renderPanel(0);
renderPanel(1);
const _wb = document.getElementById('wrapToggle');
if (_wb) _wb.textContent = isWrap ? 'Wrap: On' : 'Wrap: Off';

let _rt;
window.addEventListener('resize', () => {
  clearTimeout(_rt);
  _rt = setTimeout(() => { rebuildLn(0); rebuildLn(1); }, 80);
});
window.addEventListener('beforeunload', save);
</script>
</body>
